name: Update literature radar

on:
  workflow_dispatch:

  schedule:
    - cron: '30 8 * * 1-5'
      timezone: "Europe/Berlin"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update papers
        env:
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6
        run: python scripts/update_papers.py

      - name: Commit updated papers
        run: |
          git config user.name "literature-radar-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/papers.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: daily literature update"
            git push
          else
            echo "No new papers."
          fi
